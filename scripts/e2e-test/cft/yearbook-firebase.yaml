AWSTemplateFormatVersion: 2010-09-09
Description: AWS CloudFormation Template — Generated by AWS Architect for pattern "static-site". Starting architectural template, not production-ready IaC. Review security policies and sizing before deployment.
Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Deployment target environment name
  AppName:
    Type: String
    Default: yearbook-firebase
    Description: Application name used for resource naming and tagging
Resources:
  AppBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName:
        Fn::Sub: ${AppName}-${Environment}-storage-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Comment:
          Fn::Sub: CDN distribution for ${AppName} (${Environment})
        Origins:
          - Id: S3Origin
            DomainName:
              Fn::GetAtt:
                - AppBucket
                - RegionalDomainName
            S3OriginConfig: {}
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
Outputs:
  BucketName:
    Description: Name of the provisioned S3 bucket
    Value:
      Ref: AppBucket
  BucketDomainName:
    Description: Regional domain name of the S3 bucket
    Value:
      Fn::GetAtt:
        - AppBucket
        - RegionalDomainName
  DistributionDomainName:
    Description: CloudFront CDN domain name
    Value:
      Fn::GetAtt:
        - CloudFrontDistribution
        - DomainName
