AWSTemplateFormatVersion: 2010-09-09
Description: AWS CloudFormation Template — Generated by AWS Architect for pattern "full-stack-web". Starting architectural template, not production-ready IaC. Review security policies and sizing before deployment.
Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Deployment target environment name
  AppName:
    Type: String
    Default: mern-student-mgmt
    Description: Application name used for resource naming and tagging
Resources:
  AppBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName:
        Fn::Sub: ${AppName}-${Environment}-storage-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Comment:
          Fn::Sub: CDN distribution for ${AppName} (${Environment})
        Origins:
          - Id: S3Origin
            DomainName:
              Fn::GetAtt:
                - AppBucket
                - RegionalDomainName
            S3OriginConfig: {}
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName:
        Fn::Sub: ${AppName}-${Environment}-cluster
  EcsTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: ${AppName}-${Environment}-ecs-exec-role
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
  EcsTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family:
        Fn::Sub: ${AppName}-${Environment}-task
      Cpu: "256"
      Memory: "512"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn:
        Fn::GetAtt:
          - EcsTaskExecutionRole
          - Arn
      ContainerDefinitions:
        - Name: app
          Image: public.ecr.aws/docker/library/httpd:latest
          PortMappings:
            - ContainerPort: 80
  EcsService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName:
        Fn::Sub: ${AppName}-${Environment}-svc
      Cluster:
        Ref: EcsCluster
      TaskDefinition:
        Ref: EcsTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
Outputs:
  BucketName:
    Description: Name of the provisioned S3 bucket
    Value:
      Ref: AppBucket
  BucketDomainName:
    Description: Regional domain name of the S3 bucket
    Value:
      Fn::GetAtt:
        - AppBucket
        - RegionalDomainName
  DistributionDomainName:
    Description: CloudFront CDN domain name
    Value:
      Fn::GetAtt:
        - CloudFrontDistribution
        - DomainName
  EcsClusterName:
    Description: Name of the ECS Cluster
    Value:
      Ref: EcsCluster
