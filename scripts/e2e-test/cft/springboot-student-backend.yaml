AWSTemplateFormatVersion: 2010-09-09
Description: AWS CloudFormation Template — Generated by AWS Architect for pattern "generic". Starting architectural template, not production-ready IaC. Review security policies and sizing before deployment.
Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Deployment target environment name
  AppName:
    Type: String
    Default: springboot-student-backend
    Description: Application name used for resource naming and tagging
Resources:
  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName:
        Fn::Sub: ${AppName}-${Environment}-cluster
  EcsTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: ${AppName}-${Environment}-ecs-exec-role
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
  EcsTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family:
        Fn::Sub: ${AppName}-${Environment}-task
      Cpu: "256"
      Memory: "512"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn:
        Fn::GetAtt:
          - EcsTaskExecutionRole
          - Arn
      ContainerDefinitions:
        - Name: app
          Image: public.ecr.aws/docker/library/httpd:latest
          PortMappings:
            - ContainerPort: 80
  EcsService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName:
        Fn::Sub: ${AppName}-${Environment}-svc
      Cluster:
        Ref: EcsCluster
      TaskDefinition:
        Ref: EcsTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
  AppDatabase:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier:
        Fn::Sub: ${AppName}-${Environment}-db
      AllocatedStorage: "20"
      DBInstanceClass: db.t3.micro
      Engine: mysql
      MasterUsername: adminuser
      MasterUserPassword: MustBeChanged123!
      PubliclyAccessible: false
      DeleteAutomatedBackups: true
      BackupRetentionPeriod: 7
Outputs:
  EcsClusterName:
    Description: Name of the ECS Cluster
    Value:
      Ref: EcsCluster
  DatabaseEndpoint:
    Description: RDS Database connection endpoint address
    Value:
      Fn::GetAtt:
        - AppDatabase
        - Endpoint.Address
